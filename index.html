<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMS Reviews</title>

  <style>
    :root {
      --dark: rgb(29, 54, 68);
      --tan: rgb(185, 139, 98);
      --white: #ffffff;
      --soft-white: rgba(255, 255, 255, 0.88);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--dark);
      color: var(--white);
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
    }

    .card {
      width: 100%;
      max-width: 460px;
      text-align: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 26px;
      padding: 34px 22px;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.28);
    }

    .logo-wrap {
      width: 128px;
      height: 128px;
      margin: 0 auto 22px;
      border-radius: 50%;
      background: var(--tan);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: -0.4px;
    }

    .subtitle {
      margin: 12px auto 24px;
      max-width: 340px;
      color: var(--soft-white);
      font-size: 16px;
      line-height: 1.55;
    }

    .stars {
      margin-bottom: 24px;
      color: var(--tan);
      font-size: 24px;
      letter-spacing: 3px;
    }

    .review-links {
      display: grid;
      gap: 14px;
    }

    .review-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      width: 100%;
      padding: 17px 18px;
      border-radius: 16px;
      background: var(--tan);
      color: var(--white);
      text-decoration: none;
      font-weight: 700;
      font-size: 17px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
    }

    .review-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.28);
    }

    .review-button:active {
      transform: translateY(0);
      opacity: 0.9;
    }

    .button-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex: 0 0 auto;
    }

    .arrow {
      font-size: 22px;
      line-height: 1;
    }

    .note {
      margin: 24px 0 0;
      color: rgba(255, 255, 255, 0.72);
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 420px) {
      .card {
        padding: 28px 18px;
        border-radius: 22px;
      }

      h1 {
        font-size: 25px;
      }

      .logo-wrap {
        width: 112px;
        height: 112px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card" aria-label="Review links">
      <div class="logo-wrap">
        <img src="./cover.png" alt="BMS logo" />
      </div>

      <h1>We Appreciate Your Feedback</h1>
      <p class="subtitle">
       Please leave us a review on one or more of the platforms below.
      </p>

      <div class="stars" aria-label="Five star rating">★★★★★</div>

      <div class="review-links">
        <a class="review-button" href="https://g.page/r/CVKlrwASasyZEBM/review" target="_blank" rel="noopener noreferrer">
          <span class="button-left"><span class="icon">G</span>Google Reviews</span>
          <span class="arrow">›</span>
        </a>

        <a class="review-button" href="https://www.checkatrade.com/give-feedback/trades/bmstransport" target="_blank" rel="noopener noreferrer">
          <span class="button-left"><span class="icon">✓</span>Checkatrade Reviews</span>
          <span class="arrow">›</span>
        </a>

        <a class="review-button" href="https://uk.trustpilot.com/evaluate/bmstransport.co.uk" target="_blank" rel="noopener noreferrer">
          <span class="button-left"><span class="icon">★</span>Trustpilot Reviews</span>
          <span class="arrow">›</span>
        </a>
      </div>

      <p class="note">Thank you for taking the time to check our customer feedback.</p>
<footer style="text-align:center; padding: 25px 0;">
  <a href="bmsremovalsandstorage.vcf" download
     style="color: rgb(185, 139, 98); text-decoration: none; font-weight: 600;">
    Keep in touch with us
  </a>
</footer>
    </section>
  </main>
</body>
</html>
